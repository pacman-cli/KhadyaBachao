name: mobile-ci

on:
  push:
    paths: ["mobile/**", ".github/workflows/mobile-ci.yml"]
  pull_request:
    paths: ["mobile/**"]
  workflow_dispatch:

jobs:
  check:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src App.tsx
      - name: Unit tests
        run: npm test -- --watchAll=false

  build-android:
    name: Build Android Emulator APK
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "17"
      - name: Install dependencies
        run: npm ci
      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  build-ios:
    name: Build iOS Simulator App
    runs-on: macos-14
    needs: check
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install CocoaPods
        run: |
          cd ios
          pod install
      - name: Build iOS Simulator App
        run: |
          cd ios
          xcodebuild -workspace KhadyaBachao.xcworkspace \
                     -scheme KhadyaBachao \
                     -sdk iphonesimulator \
                     -configuration Debug \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO
          cd build/Build/Products/Debug-iphonesimulator
          zip -r KhadyaBachao-Simulator.app.zip KhadyaBachao.app
      - name: Upload iOS Simulator App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: mobile/ios/build/Build/Products/Debug-iphonesimulator/KhadyaBachao-Simulator.app.zip
          retention-days: 14
