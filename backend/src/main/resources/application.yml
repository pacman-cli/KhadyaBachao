spring:
  application:
    name: khadya-bachao-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:khadyabachao}
    username: ${DB_USER:khadya}
    password: ${DB_PASSWORD:khadya}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.khadyabachao: DEBUG
    org.hibernate.SQL: DEBUG

app:
  upload:
    dir: ${UPLOAD_DIR:uploads}
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-khadya-bachao-jwt-secret-key-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  firebase:
    # set FIREBASE_ENABLED=true + FIREBASE_CREDENTIALS_PATH in production
    enabled: ${FIREBASE_ENABLED:false}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:19006}
