spring:
  application:
    name: khadya-bachao-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:khadyabachao}
    username: ${DB_USER:khadya}
    password: ${DB_PASSWORD:khadya}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        # Turns every lazy-association N+1 into batched IN queries (32 keys
        # each) as a safety net for queries without explicit fetch joins.
        default_batch_fetch_size: 32

  data:
    web:
      pageable:
        # Hard cap for every client-supplied ?size= across list endpoints.
        max-page-size: 100

  servlet:
    multipart:
      # Audit B38/X2: Spring's 1MB default rejected most camera photos before the
      # controller's 5MB check could produce a friendly error.
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:15MB}

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.khadyabachao: ${LOG_LEVEL_APP:DEBUG}
    # Audit B62: SQL (with bind parameters → PII) must not ship to logs by default.
    org.hibernate.SQL: ${LOG_LEVEL_SQL:INFO}


app:
  storage:
    provider: ${STORAGE_PROVIDER:local} # local | r2 | firebase
  upload:
    dir: ${UPLOAD_DIR:uploads}
  cloudflare:
    r2:
      account-id: ${CLOUDFLARE_R2_ACCOUNT_ID:}
      access-key-id: ${CLOUDFLARE_R2_ACCESS_KEY_ID:}
      secret-access-key: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:}
      bucket-name: ${CLOUDFLARE_R2_BUCKET_NAME:khadya-bachao-uploads}
      public-url-prefix: ${CLOUDFLARE_R2_PUBLIC_URL_PREFIX:}
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-khadya-bachao-jwt-secret-key-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  firebase:
    # set FIREBASE_ENABLED=true + FIREBASE_CREDENTIALS_PATH in production
    enabled: ${FIREBASE_ENABLED:false}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:19006}
  rate-limit:
    # Audit B12: X-Forwarded-For is only honoured when the request arrives from
    # one of these trusted proxy CIDRs (comma-separated); empty = remote addr.
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:20}
    window-ms: ${RATE_LIMIT_WINDOW_MS:60000}

---
# Production profile (must stay the LAST document so it can override anything
# above without swallowing it):
# - adds the prod-only Flyway location that deactivates the V12 demo/seed
#   accounts (audit B57);
# - keeps Swagger/OpenAPI out of production builds (audit B1);
# - forces real Firebase token verification so the dev auth backdoor can never
#   activate, even with FIREBASE_ENABLED unset (audit B8).
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    locations: classpath:db/migration,classpath:db/migration/prod

# Audit finding: the default DEBUG app-level logging must not ship to prod.
logging:
  level:
    com.khadyabachao: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  firebase:
    enabled: true

